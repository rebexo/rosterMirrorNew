spring.application.name=backend
spring.profiles.active=web, dev

# --- DB config fuer AWS (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
# pw in template.yaml!
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# --- HIBERNATE / JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update': Erstellt die Tabellen beim ersten Start automatisch
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# --- 3. SICHERHEIT (JWT) ---
# Secret aus den Variablen (mit lokalem Fallback fuer Tests)
jwt.secret=${JWT_SECRET:HierMussEinLangesGeheimesPasswortHinDasNurLokalGenutztWird123456}

# --- 4. OPTIMIERUNG FUER AWS LAMBDA ---
# Lazy Initialization (senkt die Kaltstart-Zeit, nach snapstart eig nicht mehr noetig)
spring.main.lazy-initialization=true

# --- 5. TIMEFOLD SOLVER ---
timefold.solver.solver.termination.spent-limit=PT30S

# --- 6. LOGGING & MONITORING ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.SQL=DEBUG